name: cherrytree_flutter
description: "Unofficial CherryTree-style hierarchical notes (Spike B read-only import)"
publish_to: 'none'

version: 0.2.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  uuid: ^4.5.1
  xml: ^6.5.0
  sqflite: ^2.4.1
  file_picker: ^10.3.10
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  generate: true
  uses-material-design: true
